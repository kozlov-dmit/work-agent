[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "work-agent"
version = "0.1.0"
description = "Dockerized, provider-agnostic LLM agent that performs arbitrary actions via tools"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.40",
    "openai>=1.40",
    "pyyaml>=6.0",
    "httpx>=0.27",
    "rich>=13.0",
]

[project.optional-dependencies]
web = ["fastapi>=0.110", "uvicorn[standard]>=0.27"]
telegram = ["python-telegram-bot>=21.0"]
dev = ["pytest>=8.0", "fastapi>=0.110", "uvicorn[standard]>=0.27", "httpx>=0.27"]

[project.scripts]
work-agent = "work_agent.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/work_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
