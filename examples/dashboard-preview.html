<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>work-agent — dashboard (design preview)</title>
<!--
  Standalone DESIGN PREVIEW of the work-agent dashboard.
  Uses mock data (no server). Open directly in a browser.
  The live version is served at /dashboard by `work-agent serve`.
-->
<style>
  :root { color-scheme: light dark; }
  body { font-family: system-ui, sans-serif; margin: 0; }
  header { padding: .6rem 1rem; border-bottom: 1px solid #8884; font-weight: 600; }
  header .badge { font-weight: 400; font-size: .72rem; opacity: .6; border: 1px solid #8886;
                  border-radius: 1rem; padding: .1rem .5rem; margin-left: .4rem; }
  nav { display: flex; gap: .5rem; padding: .5rem 1rem; border-bottom: 1px solid #8884; }
  nav button { padding: .4rem .8rem; border: 1px solid #8886; border-radius: .5rem;
               background: transparent; cursor: pointer; font: inherit; }
  nav button.active { background: #2563eb; color: #fff; border-color: #2563eb; }
  main { padding: 1rem; max-width: 880px; }
  section { display: none; }
  section.active { display: block; }
  h3 { margin: 1.2rem 0 .5rem; }
  .cards { display: flex; flex-wrap: wrap; gap: .75rem; }
  .card { flex: 1 1 140px; border: 1px solid #8884; border-radius: .6rem; padding: .75rem; }
  .card .v { font-size: 1.5rem; font-weight: 700; }
  .card .l { opacity: .7; font-size: .8rem; }
  table { width: 100%; border-collapse: collapse; }
  th, td { text-align: left; padding: .4rem; border-bottom: 1px solid #8883; font-size: .9rem; }
  td button { font: inherit; padding: .2rem .5rem; border: 1px solid #8886;
              border-radius: .4rem; background: transparent; cursor: pointer; margin-right: .25rem; }
  label { display: block; margin: .5rem 0 .15rem; font-size: .85rem; opacity: .8; }
  input, select, textarea { width: 100%; padding: .4rem; border: 1px solid #8886;
                            border-radius: .4rem; box-sizing: border-box; font: inherit; }
  textarea { min-height: 6rem; }
  button.go { margin-top: .8rem; padding: .5rem 1rem; border: 0; border-radius: .5rem;
              background: #2563eb; color: #fff; cursor: pointer; font: inherit; }
  .row { display: flex; gap: .5rem; } .row > * { flex: 1; }
  .muted { opacity: .65; font-size: .85rem; }
</style>
</head>
<body>
<header>work-agent — dashboard <span class="badge">design preview · mock data</span></header>
<nav>
  <button data-tab="metrics" class="active">Metrics</button>
  <button data-tab="tasks">Scheduled tasks</button>
  <button data-tab="config">Config</button>
</nav>
<main>
  <section id="metrics" class="active">
    <div class="cards" id="sys"></div>
    <h3>Tokens &amp; reliability</h3>
    <div class="cards" id="usage"></div>
    <p class="muted" id="uptime"></p>
  </section>

  <section id="tasks">
    <table><thead><tr><th>id</th><th>cron</th><th>deliver</th><th>next</th>
      <th>task</th><th></th></tr></thead><tbody id="tasks-body"></tbody></table>
    <h3>Add task</h3>
    <div class="row">
      <div><label>cron</label><input id="t-cron" placeholder="0 9 * * *" value="0 9 * * *" /></div>
      <div><label>timezone (optional)</label><input id="t-tz" placeholder="Europe/Moscow" /></div>
    </div>
    <label>task</label><input id="t-task" placeholder="send a news digest" value="send a news digest" />
    <button class="go">Add</button>
    <p class="muted">Dashboard-created tasks deliver to a log file under
      /workspace/.work-agent/schedule-output/.</p>
  </section>

  <section id="config">
    <h3>Models per purpose</h3>
    <div id="profiles"></div>
    <label>Default profile</label><select id="c-default"></select>
    <label>System prompt addendum (appended to every turn)</label>
    <textarea id="c-extra">Always answer in Russian. Prefer concise, well-structured replies.</textarea>
    <div class="row">
      <div><label>Effort</label>
        <select id="c-effort"><option>low</option><option>medium</option>
          <option selected>high</option><option>xhigh</option><option>max</option></select></div>
      <div><label>Permission default</label>
        <select id="c-perm"><option>allow</option><option selected>ask</option><option>deny</option></select></div>
      <div><label>Max iterations</label><input id="c-maxit" type="number" value="50" /></div>
    </div>
    <button class="go">Save config</button>
    <p class="muted">Preview only — buttons don't persist anything here.</p>
  </section>
</main>

<script>
  // ---- Mock data (stands in for the /api/* responses) ----
  const MOCK_METRICS = {
    uptime_seconds: 4521,
    tokens: { input: 184320, output: 51234, total: 235554 },
    llm: { requests: 312, failures: 3, refusals: 1, reliability: 0.9904 },
    tools: { calls: 487, errors: 12 },
    system: { available: true, cpu_percent: 23.4, memory_percent: 41.2,
              memory_used_mb: 3312.5, memory_total_mb: 8042.0,
              net_sent_mb: 128.7, net_recv_mb: 542.3 },
  };
  const MOCK_TASKS = [
    { id: "39c0cc1e", cron: "0 9 * * *", delivery: { type: "telegram" },
      next_run: "2026-06-17T09:00:00", task: "Собрать и прислать дайджест ИИ-новостей", enabled: true },
    { id: "7b1a4f02", cron: "0 18 * * 1-5", delivery: { type: "telegram" },
      next_run: "2026-06-16T18:00:00", task: "Сводка задач за день из трекера", enabled: true },
    { id: "c4e9d710", cron: "*/30 * * * *", delivery: { type: "log" },
      next_run: "2026-06-16T10:00:00", task: "Проверить доступность сайта и записать статус", enabled: false },
  ];
  const MOCK_CONFIG = {
    default_profile: "chat",
    profiles: {
      chat:        { provider: "anthropic", model: "claude-opus-4-8" },
      search:      { provider: "deepseek", model: "deepseek-chat" },
      development: { provider: "anthropic", model: "claude-opus-4-8", effort: "xhigh" },
      analysis:    { provider: "openai_compatible", model: "llama3.1" },
    },
  };
  const ROLES = ["chat", "search", "development", "analysis"];
  const PROVIDERS = ["anthropic", "deepseek", "openai_compatible"];

  const $ = (id) => document.getElementById(id);
  document.querySelectorAll("nav button").forEach((b) => b.onclick = () => {
    document.querySelectorAll("nav button").forEach((x) => x.classList.remove("active"));
    document.querySelectorAll("section").forEach((x) => x.classList.remove("active"));
    b.classList.add("active"); $(b.dataset.tab).classList.add("active");
  });
  const card = (v, l) => `<div class="card"><div class="v">${v}</div><div class="l">${l}</div></div>`;
  const jitter = (n, d) => Math.max(0, +(n + (Math.random() - 0.5) * d).toFixed(1));

  function renderMetrics() {
    const m = MOCK_METRICS, s = m.system;
    // small live-feel jitter on system gauges
    const cpu = jitter(s.cpu_percent, 8), mem = jitter(s.memory_percent, 3);
    $("sys").innerHTML =
      card(cpu + "%", "CPU") + card(mem + "%", "Memory")
      + card(s.memory_used_mb + " / " + s.memory_total_mb + " MB", "RAM used")
      + card(s.net_sent_mb + " / " + s.net_recv_mb + " MB", "Net sent / recv");
    $("usage").innerHTML =
      card(m.tokens.total.toLocaleString(), "Tokens total")
      + card(m.tokens.input.toLocaleString() + " / " + m.tokens.output.toLocaleString(), "Input / output")
      + card((m.llm.reliability * 100).toFixed(1) + "%", "LLM reliability")
      + card(m.llm.requests, "LLM requests")
      + card(m.llm.failures, "Failures")
      + card(m.tools.calls + " / " + m.tools.errors, "Tool calls / errors");
    $("uptime").textContent = "uptime: " + m.uptime_seconds + "s · refusals: " + m.llm.refusals;
  }

  function renderTasks() {
    $("tasks-body").innerHTML = MOCK_TASKS.map((t) => `<tr>
      <td>${t.id}</td><td>${t.cron}</td><td>${t.delivery.type}</td>
      <td>${t.next_run}</td><td>${t.task.slice(0, 40)}</td>
      <td><button>${t.enabled ? "disable" : "enable"}</button><button>delete</button></td></tr>`).join("");
  }

  function renderConfig() {
    $("profiles").innerHTML = ROLES.map((role) => {
      const p = MOCK_CONFIG.profiles[role] || {};
      const opts = PROVIDERS.map((pr) => `<option ${pr === p.provider ? "selected" : ""}>${pr}</option>`).join("");
      return `<div class="row" style="margin-bottom:.4rem"><div><label>${role} · provider</label>
        <select><option value=""></option>${opts}</select></div>
        <div><label>model</label><input value="${p.model || ""}" /></div>
        <div><label>effort</label><input value="${p.effort || ""}" /></div></div>`;
    }).join("");
    $("c-default").innerHTML = ROLES.map((r) =>
      `<option ${r === MOCK_CONFIG.default_profile ? "selected" : ""}>${r}</option>`).join("");
  }

  renderMetrics(); renderTasks(); renderConfig();
  setInterval(renderMetrics, 3000);   // mimic the live auto-refresh
</script>
</body>
</html>
