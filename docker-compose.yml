# `docker compose up` brings up all three long-running services:
#   web       — chat + dashboard at http://localhost:8000
#   telegram  — Telegram bot (needs TELEGRAM_BOT_TOKEN in .env)
#   scheduler — the single cron scheduler that runs due tasks
#
# There is exactly one scheduler (this service). The Telegram bot does NOT run
# its own, so tasks never fire twice. Tasks created from any frontend land in the
# shared /workspace/.work-agent/schedules.json and are picked up here.
#
# One-off commands still work, e.g.:
#   docker compose run --rm web run "your task"
#   docker compose run --rm web chat

x-base: &base
  build: .
  image: work-agent:latest
  env_file:
    - .env
  environment:
    # The agent loads and self-edits this config file.
    - WORK_AGENT_CONFIG=/app/config.yaml
  volumes:
    # Mount your project so the agent can read/write files in /workspace.
    # All persistent state lives under /workspace/.work-agent.
    - ./workspace:/workspace
    # Writable so the agent/dashboard can reconfigure itself (run
    # `cp config.example.yaml config.yaml` on the host first).
    - ./config.yaml:/app/config.yaml
  restart: unless-stopped

services:
  web:
    <<: *base
    command: ["serve"]
    ports:
      - "8000:8000"

  telegram:
    <<: *base
    command: ["telegram"]

  scheduler:
    <<: *base
    command: ["scheduler"]
