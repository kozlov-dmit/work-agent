services:
  work-agent:
    build: .
    image: work-agent:latest
    stdin_open: true
    tty: true
    env_file:
      - .env
    environment:
      # The agent loads and self-edits this config file.
      - WORK_AGENT_CONFIG=/app/config.yaml
    ports:
      # Web chat server (used by the `serve` command).
      - "8000:8000"
    volumes:
      # Mount your project so the agent can read/write files in /workspace.
      # Self-installed tools persist here under /workspace/.work-agent.
      - ./workspace:/workspace
      # Writable so the agent can reconfigure itself (run `cp config.example.yaml
      # config.yaml` on the host first, or it will be created as a directory).
      - ./config.yaml:/app/config.yaml
    # Default is `chat`. Other frontends:
    #   docker compose run --rm --service-ports work-agent serve
    #   docker compose run --rm work-agent telegram
    #   docker compose run --rm work-agent run "your task"
